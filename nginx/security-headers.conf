# Security headers for every response. The CSP is what guarantees the page cannot send your text anywhere:
# connect-src 'none' blocks fetch/XHR/WebSocket, and there is no inline script or style to inject.
#
# nginx does not inherit add_header into a location that sets its own, so every location includes this file.
# Keep one header per line: vite.config.ts reads these lines for `npm run preview`, and tests/security.test.ts
# checks them.

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Only when a TLS-terminating proxy in front says the request was HTTPS (empty value = header omitted).
add_header Strict-Transport-Security $hsts always;
