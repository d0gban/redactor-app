# Serves the built app. Replaces the old Flask server: there is no API, only static files and headers.

map $http_x_forwarded_proto $hsts {
  default "";
  https   "max-age=63072000; includeSubDomains";
}

# Only a file that was actually served may be cached forever: a miss on a hashed name must not be remembered.
map $status $assets_cache_control {
  default "no-store";
  200     "public, max-age=31536000, immutable";
  304     "public, max-age=31536000, immutable";
}

server {
  listen 8000;
  listen [::]:8000;
  server_name _;
  server_tokens off;

  # Responses sent before a location is chosen (the 405 below) get the headers from here.
  include /etc/nginx/security-headers.conf;

  root /usr/share/nginx/html;

  # The app never accepts a request body or anything but a page load.
  client_max_body_size 1k;
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  location = /healthz {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # The HTML shell names the current content-hashed files, so it must never be cached.
  location = / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Vite content-hashes everything in /assets (JS, CSS, fonts): safe to cache forever.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $assets_cache_control always;
    try_files $uri =404;
  }

  # Unhashed files (theme.js, favicon, icons): revalidate with the ETag.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
}
