<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Prompt Redactor{% endblock %}</title>
  <meta name="description" content="Strip secrets and personal data from prompts before sending them to an AI tool, then restore the reply. Runs entirely in your browser.">

  <link rel="icon" href="{{ url_for('main.favicon') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ asset_url('icon/favicon-32x32.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ asset_url('icon/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ asset_url('css/app.css') }}">
  <script type="module" src="{{ asset_url('js/main.js') }}"></script>
</head>
<body>
  <noscript>
    <p class="noscript">Prompt Redactor needs JavaScript. All processing happens locally in your browser.</p>
  </noscript>
  {% block content %}{% endblock %}
</body>
</html>
